name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build
        
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.HOSTINGER_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy Frontend via rsync
        run: |
          # Menyalin hasil build Nuxt (.output/public) ke public_html
          rsync -avz --delete -e "ssh -p ${{ secrets.SSH_PORT }}" \
            ./frontend/.output/public/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DOMAIN_ROOT }}/public_html/

      - name: Deploy Backend via SSH
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ${{ secrets.DOMAIN_ROOT }}/source
            git fetch origin main
            git reset --hard origin/main
            
            cd backend
            npm install
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            
            # Restart service (Sesuaikan dengan metode Node.js Hostinger, misalnya PM2)
            # pm2 restart backend
          EOF
